<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>ins-cli 配對</title>
<style>body{width:310px;padding:16px;background:#17212b;color:#eef3f8;font:14px system-ui}input,button{box-sizing:border-box;width:100%;padding:10px;margin:6px 0}p{line-height:1.6}button{cursor:pointer}</style>
<h2>連接目前的 Instagram 分頁</h2><p>先啟動 start.bat，將終端機的配對碼貼在下面。這不是 Instagram 密碼。</p>
<p>配對碼是這次 CLI 的本機連線鑰匙，讓擴充套件連上正確的程式，並限制其他網頁控制它。關閉 CLI 後失效。</p>
<input id="token" type="password" placeholder="本次 CLI 配對碼" autocomplete="off"><button id="connect">連接此分頁</button><button id="disconnect">中斷連線</button><p id="status" role="status"></p><script src="popup.js"></script></html>
